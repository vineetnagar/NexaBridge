<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="NexaBridge logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#14142B"/>
      <stop offset="1" stop-color="#05050A"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6D7CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#6D7CFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C2FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background (remove this rect for a transparent logo) -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <circle cx="100" cy="100" r="88" fill="url(#halo)"/>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Portal ring with openings left and right -->
    <path d="M29.57 85.03 A72 72 0 0 1 170.43 85.03" stroke-width="6"/>
    <path d="M170.43 114.97 A72 72 0 0 1 29.57 114.97" stroke-width="6"/>

    <!-- Gate / bridge arches -->
    <path d="M70 130 V104 A30 30 0 0 1 130 104 V130" stroke-width="6"/>
    <path d="M86 130 V108 A14 14 0 0 1 114 108 V130" stroke-width="4" opacity="0.6"/>

    <!-- Deck -->
    <line x1="56" y1="130" x2="144" y2="130" stroke-width="6"/>
  </g>

  <!-- Connection nodes -->
  <g fill="#FFFFFF">
    <circle cx="20" cy="100" r="5.5"/>
    <circle cx="180" cy="100" r="5.5"/>
    <circle cx="100" cy="82" r="4"/>
  </g>
</svg>
